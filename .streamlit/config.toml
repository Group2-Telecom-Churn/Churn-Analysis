[theme]
base = "dark"
primaryColor = "#3b82f6"
 
# Typography. "Family:CSS-URL" loads the font from Google Fonts.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
 
[theme.dark]
backgroundColor = "#0b1730"
secondaryBackgroundColor = "#101b35"
textColor = "#f8fafc"
 
[theme.light]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f9"
textColor = "#0f172a"
 
[client]
toolbarMode = "viewer"
