[theme]
base = "dark"
primaryColor = "#3b82f6"
 
# Typography. "sans-serif" / "monospace" are Streamlit's own bundled faces
# (Source Sans / Source Code Pro) - served with the app, so nothing is
# downloaded from a third party at runtime.
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
 
[theme.dark]
backgroundColor = "#0b1730"
secondaryBackgroundColor = "#101b35"
textColor = "#f8fafc"
 
[theme.light]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f9"
textColor = "#0f172a"
 
[client]
toolbarMode = "viewer"
